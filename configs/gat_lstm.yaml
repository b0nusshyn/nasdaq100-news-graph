# Proposed model (#29). Folds and the embargo come from walk_forward.yaml, shared by every model.
model: gat_lstm             # predictions/<model>.parquet
seed: 42
horizons: [1, 5]           # one model per horizon and fold
window_days: 20            # LSTM look-back, trading days up to and including the prediction day
features:                  # src.models.panel; every statistic is fitted on the training fold only
  price: [ret_1d, volatility_20d, rsi_14, macd, macd_signal, volume_z_20d]
  news: [has_news, sentiment, confidence]
  embeddings: true         # FinBERT embedding via per-fold PCA; false is the "do embeddings help" ablation
  embedding_dim: 64        # PCA components kept
encoder:
  hidden: 64
  layers: 1
  dropout: 0.1
gat:
  heads: 4
  edge_types: [sector, comention, corr]
train:                     # 3.12 (#58): config T1 of results/tables/tuning_gat_lstm.md, shared by B5, B6, proposed
  epochs: 40
  batch_days: 8            # trading days per optimiser step, batched as one disjoint graph (56 steps per epoch)
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  validation_fraction: 0.1     # last 10% of each training fold, after the embargo, for early stopping
  validate_every_steps: 14     # validation checks per epoch: 4
  early_stopping_metric: within_day_auc   # the headline; validation loss is mostly market timing
  early_stopping_patience: 4   # epochs without a higher validation within-day AUC
