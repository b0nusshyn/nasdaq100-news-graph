# Shared by the proposed model and every baseline: all models are scored on the same folds.
# Draft values; Evaluation owns this file (#12).
period:
  start: 2019-01-01
  end: 2023-12-31
train_days: 504      # actual training days, excluding the separate embargo
test_days: 126       # first complete fold requires 504 + 5 + 126 = 635 trading days
step_days: 126       # advance by one test window per fold
expanding: false     # rolling window
embargo_days: 5      # same for both horizons; also the splitter's default when omitted
