name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The light set (requirements-dev.txt) must import src.core and run every CLI's --help.
  # Tests needing torch, scikit-learn, statsmodels, xgboost or transformers skip here; -rs lists
  # them, and the full job below runs them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -rs

  # Everything, nothing skipped: NDX_NO_SKIPS=1 fails the run if any test skips (tests/conftest.py).
  # CPU torch first, so requirements.txt does not pull the CUDA build.
  test-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pytest -rs
        env:
          NDX_NO_SKIPS: "1"
